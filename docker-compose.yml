# Runs the service and PostgreSQL exactly as deployed:  docker compose up --build
# Secrets come from a .env file next to this file; the defaults below are for local dev only.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: seatbooking
      POSTGRES_USER: seatbooking
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seatbooking}
    ports:
      - "127.0.0.1:5433:5432"   # localhost only; 5433 so it does not clash with a local Postgres on 5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbooking -d seatbooking"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: seat-reservation:latest   # deploy.sh ships this image; the server never builds
    build: .
    restart: unless-stopped
    mem_limit: 768m                  # MaxRAMPercentage=75 -> ~576 MB heap
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/seatbooking
      DB_USER: seatbooking
      DB_PASSWORD: ${DB_PASSWORD:-seatbooking}
      JWT_SECRET: ${JWT_SECRET:-compose-dev-secret-change-me-0123456789abcdef}
    ports:
      - "8080:8080"

  # Optional, local only: not started unless the profile is given.
  #   docker compose --profile monitoring up -d   ->  UI at http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: ["monitoring"]
    depends_on:
      - app
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  db-data:
